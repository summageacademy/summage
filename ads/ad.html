<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Ad Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px 20px;
            background: #f0f4f8;
        }

        .ad-container {
            max-width: 320px;
            margin: 0 auto;
            background: white;
            overflow: hidden;
            border-radius: 11px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .ad-header {
            height: 38px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-size: 13.5px;
            font-weight: 800;
            letter-spacing: 1.1px;
            color: white;
            border-bottom: 6px solid;        /* Reduced thickness */
            position: relative;
        }

        .ad-banner {
            height: 50px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-left: 4px solid;
            border-right: 4px solid;
            border-bottom: 4px solid;
        }

        .placeholder-content {
            text-align: center;
            color: #777;
            font-size: 13px;
            font-weight: 500;
        }

        .ad-label {
            margin-right: auto;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; margin-bottom: 30px;">Mobile Banner Ad Space (320×50)</h2>
    
    <div class="ad-container" id="adSpace">
        <div class="ad-header" id="adHeader">
            <span class="ad-label">ADVERTISEMENT</span>
        </div>
        <div class="ad-banner" id="adBanner">
            <div class="placeholder-content">
                Your Ad Here<br>
                <small>320 × 50</small>
            </div>
        </div>
    </div>

    <p style="text-align: center; margin-top: 50px; color: #555; font-size: 14px;">
        Refresh for random colors • Top border now smaller
    </p>

    <script>
        const colors = [
            '#9C27B0', // Purple
            '#FF9800', // Orange
            '#4CAF50', // Green
            '#2196F3', // Blue
            '#F44336'  // Red
        ];

        function initAdSpace() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            const container = document.getElementById('adSpace');
            const header = document.getElementById('adHeader');
            const banner = document.getElementById('adBanner');

            // Header background + border same color
            header.style.backgroundColor = randomColor;
            header.style.borderBottomColor = randomColor;

            // Banner outlines
            banner.style.borderColor = randomColor;

            // Container outer border
            container.style.border = `4px solid ${randomColor}`;

            console.log(`%cLoaded with color: ${randomColor}`, `color: ${randomColor}; font-weight: bold`);
        }

        window.onload = initAdSpace;
    </script>

</body>
</html>
