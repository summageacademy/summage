<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
      min-height: 100vh;
    }
    .question-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }
    .question-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }
    .accent-orange { color: #f24b0b; }
    .accent-green { color: #06a87c; }
  </style>
</head>
<body class="pb-16">

  <div class="max-w-2xl mx-auto px-6 pt-12">
    <!-- Header -->
    <div class="text-center mb-12">
      <h1 class="text-4xl font-bold accent-green mb-3">My Awesome Form</h1>
      <p class="text-lg text-gray-600">Fill out the questions below</p>
    </div>

    <!-- Question 1 -->
    <div class="question-card p-8 mb-8">
      <h2 class="text-xl font-semibold mb-6 flex items-center gap-3">
        <span class="text-2xl accent-orange">1.</span> 
        What is your favorite programming language?
      </h2>
      <div class="space-y-4">
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="radio" name="q1" class="w-6 h-6 accent-orange">
          <span>JavaScript</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="radio" name="q1" class="w-6 h-6 accent-orange">
          <span>Python</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="radio" name="q1" class="w-6 h-6 accent-orange">
          <span>TypeScript</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="radio" name="q1" class="w-6 h-6 accent-orange">
          <span>Rust</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="radio" name="q1" class="w-6 h-6 accent-orange">
          <span>Other</span>
        </label>
      </div>
    </div>

    <!-- Question 2 -->
    <div class="question-card p-8 mb-8">
      <h2 class="text-xl font-semibold mb-6 flex items-center gap-3">
        <span class="text-2xl accent-orange">2.</span> 
        Which technologies are you comfortable with? 
        <span class="text-sm font-normal text-gray-500">(Select all that apply)</span>
      </h2>
      <div class="space-y-4">
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="checkbox" class="w-6 h-6 accent-orange">
          <span>React</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="checkbox" class="w-6 h-6 accent-orange">
          <span>Node.js</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="checkbox" class="w-6 h-6 accent-orange">
          <span>Tailwind CSS</span>
        </label>
        <label class="flex items-center gap-4 cursor-pointer text-lg">
          <input type="checkbox" class="w-6 h-6 accent-orange">
          <span>Python / Django</span>
        </label>
      </div>
    </div>

    <!-- Question 3 -->
    <div class="question-card p-8 mb-8">
      <h2 class="text-xl font-semibold mb-6 flex items-center gap-3">
        <span class="text-2xl accent-orange">3.</span> 
        How did you hear about us?
      </h2>
      <select class="w-full border border-gray-200 rounded-2xl px-6 py-4 text-lg focus:outline-none focus:border-orange-400">
        <option value="">Choose an option...</option>
        <option>Twitter / X</option>
        <option>Friend / Colleague</option>
        <option>Google Search</option>
        <option>YouTube</option>
        <option>Other</option>
      </select>
    </div>

    <!-- Add more question cards here -->

    <div class="flex justify-center mt-12">
      <button onclick="submitForm()" 
              class="px-12 py-5 bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold text-lg rounded-3xl shadow-lg hover:scale-105 transition-all active:scale-95">
        SUBMIT FORM
      </button>
    </div>
  </div>

  <script>
    function submitForm() {
      alert("✅ Form submitted successfully!");
    }
  </script>
</body>
</html>
