<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Lessons - Summage Academy</title>
    <meta name="description" content="Master IELTS Speaking Parts 1, 2, and 3 with structured lessons from Summage Academy." />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LZP4KSPR1V"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LZP4KSPR1V');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, .content::-webkit-scrollbar {
            display: none;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .logo-text {
            font-family: 'Poppins', sans-serif !important;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        body {
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            min-height: 100vh;
            color: #333;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 5vw;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            padding: 12px 28px;
            background: #f1192e;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c40e20;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 120px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c40e20;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(242, 75, 11, 0.15);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            color: #f24b0b;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .language-selector { position: relative; }
        .language-button {
            background: none;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.25s ease;
        }
        .language-button:hover {
            background-color: rgba(242, 75, 11, 0.1);
            transform: scale(1.12);
        }
        .language-button img { width: 26px; height: 26px; }

        .language-flags {
            position: absolute;
            top: 140%;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.25s ease;
            pointer-events: none;
            min-width: 140px;
            padding: 8px 0;
            overflow: hidden;
            z-index: 200;
        }
        .language-flags.show { 
            opacity: 1; 
            transform: translateY(0); 
            pointer-events: all; 
        }

        .flag {
            padding: 13px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 15.5px;
            color: #333;
        }
        .flag:hover { background: #f24b0b10; }
        .flag img { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }

        .content {
            flex: 1;
            padding: 60px 5vw 120px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }
        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #222;
        }
        .section-desc {
            font-size: 1.1rem;
            color: #666;
            margin-top: 4px;
        }

        .lesson-card {
            background: white;
            border: 1px solid #f0e6d9;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .lesson-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(242, 75, 11, 0.12);
        }

        .lesson-header {
            padding: 28px 28px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .lesson-id {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #f24b0b;
            text-transform: uppercase;
        }
        .lesson-title {
            font-size: 1.55rem;
            font-weight: 700;
            color: #222;
            margin-top: 6px;
        }
        .lesson-desc {
            margin-top: 16px;
            font-size: 15.5px;
            line-height: 1.55;
            color: #555;
            flex: 1;
        }

        .lesson-footer {
            border-top: 1px solid #f0e6d9;
            padding: 20px 28px;
            background: #fffaf5;
            margin-top: auto;
        }

        .start-btn {
            background: #f24b0b;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 4px 0 #c23a0a;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c23a0a;
        }

        .completed-btn {
            background: #06a87c;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 4px 0 #058f66;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .part-divider {
            border-top: 2px dashed #f0e6d9;
            margin: 60px 0;
            position: relative;
        }
        .part-divider::after {
            content: "✦";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #fffaf5;
            padding: 0 15px;
            color: #f24b0b;
            font-size: 18px;
        }

        .mobile-footer-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 14px 5vw;
            border-top: 1px solid rgba(0,0,0,0.08);
            z-index: 100;
        }
        .mobile-back-btn {
            width: 100%;
            max-width: 90vw;
            margin: 0 auto;
            padding: 16px;
            background: #f1192e;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 0 #c40e20;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .content { padding: 40px 20px 100px; }
            .section-title { font-size: 1.9rem; }
            .navbar { padding: 20px; }
            .mobile-footer-bar { display: block; }
            .back-btn { display: none; }
        }

        .page-loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-loader.hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader">
        <lottie-player 
            id="splashPanda"
            src="/assets/Sandy Loading.json"
            background="transparent" 
            speed="0.9" 
            style="width: 120px; height: 120px; opacity: 0; transform: scale(0.7) translateY(20px);"
            loop 
            autoplay>
        </lottie-player>
    </div>

    <nav class="navbar">
        <button onclick="goBack()" class="back-btn" id="desktop-back-btn">
            <span data-key="back">Back</span>
        </button>

        <div class="logo-container" onclick="window.location.href='/'">
            <img class="logo-img" src="/assets/logo.webp" alt="Summage Logo">
            <div class="logo-text">Summage</div>
        </div>

        <div class="language-selector">
            <button class="language-button" id="lang-btn" aria-label="Select language">
                <img src="/assets/images/lang/globe.webp" alt="">
            </button>
            <div class="language-flags" id="lang-flags">
                <div class="flag" data-lang="en"><img src="/assets/images/lang/en.png" alt="EN"> English</div>
                <div class="flag" data-lang="ru"><img src="/assets/images/lang/ru.png" alt="RU"> Русский</div>
                <div class="flag" data-lang="uz"><img src="/assets/images/lang/uz.png" alt="UZ"> O'zbek</div>
            </div>
        </div>
    </nav>

    <main class="content" id="speaking-container">
        </main>

    <div class="mobile-footer-bar">
        <button onclick="goBack()" class="mobile-back-btn" id="mobile-back-btn">
            <span data-key="back">Back</span>
        </button>
    </div>

    <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyDX73k3QqXr9xu_PKkQBkr9pUNp7zmtrW0",
        authDomain: "summage-backend.firebaseapp.com",
        projectId: "summage-backend",
        storageBucket: "summage-backend.firebasestorage.app",
        messagingSenderId: "128191434358",
        appId: "1:128191434358:web:4c9e9f4f9ff4a23db5d957"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const allSpeakingLessons = [
        // Part 1
        { id: 1, part: "part1", title: "Introduction & Interview", desc: "Mastering common topics like home, family, and studies.", group: "part1" },
        { id: 2, part: "part1", title: "Expanding Your Answers", desc: "Techniques for giving full, natural responses without hesitation.", group: "part1" },
        { id: 3, part: "part1", title: "Fluency Basics", desc: "Avoiding awkward pauses and maintaining a steady rhythm.", group: "part1" },

        // Part 2
        { id: 4, part: "part2", title: "The Long Turn", desc: "Understanding the cue card and preparing effectively.", group: "part2" },
        { id: 5, part: "part2", title: "Structuring Your Talk", desc: "Using your 1-minute prep time to build a solid 2-minute response.", group: "part2" },
        { id: 6, part: "part2", title: "Vocabulary for Storytelling", desc: "Engaging the examiner with rich descriptions and adjectives.", group: "part2" },

        // Part 3
        { id: 7, part: "part3", title: "Two-Way Discussion", desc: "Handling abstract and complex follow-up questions.", group: "part3" },
        { id: 8, part: "part3", title: "Expressing Opinions", desc: "Defending your views logically and structuring your arguments.", group: "part3" },
        { id: 9, part: "part3", title: "Comparing & Speculating", desc: "Using advanced grammar for hypothetical scenarios.", group: "part3" }
    ];

    let completedLessons = {};
    let currentView = 'selection'; // 'selection', 'part1', 'part2', 'part3'
    let currentLang = localStorage.getItem('summage_preferred_lang') || 'en';

    const translations = {
        en: {
            back: "Back",
            loading: "Loading your progress...",
            signIn: "Please sign in to access personalized lessons",
            signInBtn: "Sign In",
            part1Title: "Speaking Part 1",
            part1Desc: "Introduction and General Topics",
            part2Title: "Speaking Part 2",
            part2Desc: "The Long Turn (Cue Card)",
            part3Title: "Speaking Part 3",
            part3Desc: "Two-Way Discussion",
            startLesson: "Start Lesson",
            retake: "Retake",
            locked: "Locked",
            selectTask: "Choose Your Part"
        },
        ru: {
            back: "Назад",
            loading: "Загрузка вашего прогресса...",
            signIn: "Пожалуйста, войдите, чтобы увидеть персонализированные уроки",
            signInBtn: "Войти",
            part1Title: "Speaking Part 1",
            part1Desc: "Введение и общие темы",
            part2Title: "Speaking Part 2",
            part2Desc: "Монолог (Карточка с заданием)",
            part3Title: "Speaking Part 3",
            part3Desc: "Двусторонняя дискуссия",
            startLesson: "Начать урок",
            retake: "Повторить",
            locked: "Заблокировано",
            selectTask: "Выберите часть"
        },
        uz: {
            back: "Orqaga",
            loading: "Sizning taraqqiyotingiz yuklanmoqda...",
            signIn: "Shaxsiy darslarni ko'rish uchun tizimga kiring",
            signInBtn: "Kirish",
            part1Title: "Speaking Part 1",
            part1Desc: "Kirish va umumiy mavzular",
            part2Title: "Speaking Part 2",
            part2Desc: "Monolog (Vazifa kartasi)",
            part3Title: "Speaking Part 3",
            part3Desc: "Ikki tomonlama munozara",
            startLesson: "Darsni boshlash",
            retake: "Qaytarish",
            locked: "Bloklangan",
            selectTask: "Qismni tanlang"
        }
    };

    function t(key) {
        return translations[currentLang]?.[key] || translations.en[key] || key;
    }

    function updateLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('summage_preferred_lang', lang);
        document.documentElement.lang = lang;
        renderCurrentView();
    }

    async function loadUserData() {
        const container = document.getElementById("speaking-container");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const progressSnap = await getDoc(doc(db, "users", user.uid, "progress", "speaking"));
                    completedLessons = progressSnap.exists() 
                        ? (progressSnap.data().lessons || {}) 
                        : {};
                } catch (e) {
                    console.error("Firestore error:", e);
                }
            } else {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-xl">${t('signIn')}</p>
                        <a href="/login" class="inline-block mt-6 bg-[#f24b0b] text-white font-bold py-4 px-12 rounded-3xl">${t('signInBtn')}</a>
                    </div>`;
                hideLoader();
                return;
            }
            renderCurrentView();
        });
    }

    function generateLessonGrid(partKey) {
        const lessons = allSpeakingLessons.filter(l => l.group === partKey);
        let cardsHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">`;
        
        lessons.forEach(l => {
            const isCompleted = !!completedLessons[l.id];
            cardsHTML += `
                <div class="lesson-card">
                    <div class="lesson-header">
                        <div class="lesson-id">LESSON ${l.id}</div>
                        <div class="lesson-title">${l.title}</div>
                        <p class="lesson-desc">${l.desc}</p>
                    </div>
                    
                    <div class="lesson-footer">
                        <a href="/learn/journeys/speaking/lesson/?id=${l.id}" 
                           class="${isCompleted ? 'completed-btn' : 'start-btn'}">
                            ${isCompleted ? t('retake') : t('startLesson')}
                        </a>
                    </div>
                </div>
            `;
        });
        cardsHTML += `</div>`;
        return cardsHTML;
    }

    function generatePartSection(partKey) {
        const title = t(`${partKey}Title`);
        const desc = t(`${partKey}Desc`);
        
        return `
            <div class="mb-10">
                <div class="flex items-center gap-4 mb-8">
                    <div>
                        <h2 class="section-title">${title}</h2>
                        <p class="section-desc">${desc}</p>
                    </div>
                </div>
                ${generateLessonGrid(partKey)}
            </div>
        `;
    }

    function renderCurrentView() {
        const container = document.getElementById("speaking-container");
        const isDesktop = window.innerWidth > 900;

        if (isDesktop) {
            // Desktop: Show all parts sequentially with dividers
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    ${generatePartSection('part1')}
                    <div class="part-divider"></div>
                    ${generatePartSection('part2')}
                    <div class="part-divider"></div>
                    ${generatePartSection('part3')}
                </div>
            `;
        } else {
            // Mobile: Utilize Selection View
            if (currentView === 'selection') {
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        <div class="grid grid-cols-1 gap-6">
                            <div onclick="selectPart('part1')" class="lesson-card cursor-pointer group">
                                <div class="lesson-header p-8 text-center">
                                    <h2 class="text-2xl font-bold mb-2">${t('part1Title')}</h2>
                                    <p class="text-gray-600">${t('part1Desc')}</p>
                                </div>
                                <div class="lesson-footer text-center py-4">
                                    <button class="start-btn w-full">Start Part 1</button>
                                </div>
                            </div>

                            <div onclick="selectPart('part2')" class="lesson-card cursor-pointer group">
                                <div class="lesson-header p-8 text-center">
                                    <h2 class="text-2xl font-bold mb-2">${t('part2Title')}</h2>
                                    <p class="text-gray-600">${t('part2Desc')}</p>
                                </div>
                                <div class="lesson-footer text-center py-4">
                                    <button class="start-btn w-full">Start Part 2</button>
                                </div>
                            </div>

                            <div onclick="selectPart('part3')" class="lesson-card cursor-pointer group">
                                <div class="lesson-header p-8 text-center">
                                    <h2 class="text-2xl font-bold mb-2">${t('part3Title')}</h2>
                                    <p class="text-gray-600">${t('part3Desc')}</p>
                                </div>
                                <div class="lesson-footer text-center py-4">
                                    <button class="start-btn w-full">Start Part 3</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            } else {
                // Mobile: Selected Part View
                container.innerHTML = `
                    <div class="max-w-6xl mx-auto">
                        ${generatePartSection(currentView)}
                    </div>
                `;
            }
        }

        hideLoader();
    }

    window.selectPart = function(part) {
        currentView = part;
        renderCurrentView();
    };

    window.goBackToSelection = function() {
        currentView = 'selection';
        renderCurrentView();
    };

    window.goBack = function() {
        const isDesktop = window.innerWidth > 900;
        
        if (!isDesktop && currentView !== 'selection') {
            goBackToSelection();
        } else {
            window.location.assign('/learn/');
        }
    }

    // Loader logic
    const loader = document.getElementById('pageLoader');
    const splashAnim = document.getElementById('splashPanda');

    setTimeout(() => { 
        if (splashAnim) { 
            splashAnim.style.opacity = '1'; 
            splashAnim.style.transform = 'scale(1) translateY(0)'; 
        } 
    }, 400);

    function hideLoader() {
        if (!loader || loader.classList.contains('hidden')) return;
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 1400);
    }

    // Listen to resize events to swap layout instantly
    window.addEventListener('resize', () => {
        // Only re-render if we cross the mobile/desktop threshold to save performance
        // But for simplicity, just re-calling it handles state perfectly.
        renderCurrentView();
    });

    // Event listeners
    window.addEventListener('load', () => {
        loadUserData();

        // Language selector
        document.getElementById('lang-btn')?.addEventListener('click', e => {
            e.stopPropagation();
            document.getElementById('lang-flags').classList.toggle('show');
        });

        document.querySelectorAll('.flag').forEach(el => {
            el.addEventListener('click', e => {
                e.stopPropagation();
                updateLanguage(el.dataset.lang);
                document.getElementById('lang-flags').classList.remove('show');
            });
        });

        document.addEventListener('click', () => {
            document.getElementById('lang-flags').classList.remove('show');
        });
    });
    </script>
</body>
</html>
