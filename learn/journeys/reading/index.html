<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Menu - Summage Academy</title>
    <meta name="description" content="Master IELTS Reading with structured lessons and full-length mock tests from Summage Academy." />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LZP4KSPR1V"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-LZP4KSPR1V');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar, .content::-webkit-scrollbar {
            display: none;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .logo-text {
            font-family: 'Poppins', sans-serif !important;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        body {
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            min-height: 100vh;
            color: #333;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 5vw;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            padding: 12px 28px;
            background: #f1192e;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c40e20;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 120px;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c40e20;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(242, 75, 11, 0.15);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            color: #f24b0b;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .language-selector { position: relative; }
        .language-button {
            background: none;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.25s ease;
        }
        .language-button:hover {
            background-color: rgba(242, 75, 11, 0.1);
            transform: scale(1.12);
        }
        .language-button img { width: 26px; height: 26px; }

        .language-flags {
            position: absolute;
            top: 140%;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.25s ease;
            pointer-events: none;
            min-width: 140px;
            padding: 8px 0;
            overflow: hidden;
            z-index: 200;
        }
        .language-flags.show { 
            opacity: 1; 
            transform: translateY(0); 
            pointer-events: all; 
        }

        .flag {
            padding: 13px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 15.5px;
            color: #333;
        }
        .flag:hover { background: #f24b0b10; }
        .flag img { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }

        .content {
            flex: 1;
            padding: 60px 5vw 120px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #222;
        }
        .section-desc {
            font-size: 1.1rem;
            color: #666;
            margin-top: 4px;
        }

        .lesson-card {
            background: white;
            border: 1px solid #f0e6d9;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .lesson-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(242, 75, 11, 0.12);
        }

        .lesson-header {
            padding: 28px 28px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .lesson-id {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #f24b0b;
            text-transform: uppercase;
        }
        .lesson-title {
            font-size: 1.55rem;
            font-weight: 700;
            color: #222;
            margin-top: 6px;
        }
        .lesson-desc {
            margin-top: 16px;
            font-size: 15.5px;
            line-height: 1.55;
            color: #555;
            flex: 1;
        }

        .lesson-footer {
            border-top: 1px solid #f0e6d9;
            padding: 20px 28px;
            background: #fffaf5;
            margin-top: auto;
        }

        .start-btn {
            background: #f24b0b;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 4px 0 #c23a0a;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c23a0a;
        }

        .completed-btn {
            background: #06a87c;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            width: 100%;
            box-shadow: 0 4px 0 #058f66;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mobile-footer-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 14px 5vw;
            border-top: 1px solid rgba(0,0,0,0.08);
            z-index: 100;
        }
        .mobile-back-btn {
            width: 100%;
            max-width: 90vw;
            margin: 0 auto;
            padding: 16px;
            background: #f1192e;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            box-shadow: 0 4px 0 #c40e20;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .content { padding: 40px 20px 100px; }
            .section-title { font-size: 1.9rem; }
            .navbar { padding: 20px; }
            .mobile-footer-bar { display: block; }
            .back-btn { display: none; }
        }

        .page-loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-loader.hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>
    <div id="pageLoader" class="page-loader">
        <lottie-player 
            id="splashPanda"
            src="/assets/Sandy Loading.json"
            background="transparent" 
            speed="0.9" 
            style="width: 120px; height: 120px; opacity: 0; transform: scale(0.7) translateY(20px);"
            loop 
            autoplay>
        </lottie-player>
    </div>

    <nav class="navbar">
        <button onclick="goBack()" class="back-btn" id="desktop-back-btn">
            <span data-key="back">Back</span>
        </button>

        <div class="logo-container" onclick="window.location.href='/'">
            <img class="logo-img" src="/assets/logo.webp" alt="Summage Logo">
            <div class="logo-text">Summage</div>
        </div>

        <div class="language-selector">
            <button class="language-button" id="lang-btn" aria-label="Select language">
                <img src="/assets/images/lang/globe.webp" alt="">
            </button>
            <div class="language-flags" id="lang-flags">
                <div class="flag" data-lang="en"><img src="/assets/images/lang/en.png" alt="EN"> English</div>
                <div class="flag" data-lang="ru"><img src="/assets/images/lang/ru.png" alt="RU"> Русский</div>
                <div class="flag" data-lang="uz"><img src="/assets/images/lang/uz.png" alt="UZ"> O'zbek</div>
            </div>
        </div>
    </nav>

    <main class="content" id="reading-container">
    </main>

    <div class="mobile-footer-bar">
        <button onclick="goBack()" class="mobile-back-btn" id="mobile-back-btn">
            <span data-key="back">Back</span>
        </button>
    </div>

    <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: "AIzaSyDX73k3QqXr9xu_PKkQBkr9pUNp7zmtrW0",
        authDomain: "summage-backend.firebaseapp.com",
        projectId: "summage-backend",
        storageBucket: "summage-backend.firebasestorage.app",
        messagingSenderId: "128191434358",
        appId: "1:128191434358:web:4c9e9f4f9ff4a23db5d957"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const allReadingLessons = [
        { id: 1, title: "Introduction & Skimming", desc: "Learn the core basics of IELTS Reading and how to quickly skim passages for main ideas.", group: "lessons" },
        { id: 2, title: "True / False / Not Given", desc: "Master the most challenging question type with clear, actionable identification strategies.", group: "lessons" },
        { id: 3, title: "Matching Headings", desc: "Develop the ability to identify paragraph themes quickly and accurately without reading every word.", group: "lessons" },
        { id: 4, title: "Summary Completion", desc: "Find specific information rapidly and fill in the blanks using grammar and context clues.", group: "lessons" },
        { id: 5, title: "Multiple Choice Questions", desc: "Learn how to systematically eliminate distractors and pinpoint the correct answers.", group: "lessons" },
        { id: 6, title: "Time Management & Pacing", desc: "Essential strategies to ensure you complete all 40 questions within the strict 60-minute limit.", group: "lessons" }
    ];

    let completedLessons = {};
    let currentView = 'selection'; // 'selection', 'lessons'
    let currentLang = localStorage.getItem('summage_preferred_lang') || 'en';

    const translations = {
        en: {
            back: "Back",
            loading: "Loading your progress...",
            signIn: "Please sign in to access personalized lessons",
            signInBtn: "Sign In",
            mocksTitle: "Reading Mocks",
            mocksDesc: "Test your skills with full-length, timed reading exams.",
            lessonsTitle: "Reading Lessons",
            lessonsDesc: "Master reading strategies from scratch to band 9.",
            startMocks: "Go to Mocks",
            startLessons: "View Lessons",
            startLesson: "Start Lesson",
            retake: "Retake",
            lessonsHeader: "IELTS Reading Lessons",
            lessonsSubHeader: "Learn the keys and components to solve any reading passage."
        },
        ru: {
            back: "Назад",
            loading: "Загрузка вашего прогресса...",
            signIn: "Пожалуйста, войдите, чтобы увидеть персонализированные уроки",
            signInBtn: "Войти",
            mocksTitle: "Пробные тесты",
            mocksDesc: "Проверьте свои навыки на полных пробных экзаменах.",
            lessonsTitle: "Уроки по Reading",
            lessonsDesc: "Освойте стратегии чтения с нуля.",
            startMocks: "Перейти к тестам",
            startLessons: "Смотреть уроки",
            startLesson: "Начать урок",
            retake: "Повторить",
            lessonsHeader: "Уроки IELTS Reading",
            lessonsSubHeader: "Изучите ключевые компоненты для решения любого текста."
        },
        uz: {
            back: "Orqaga",
            loading: "Sizning taraqqiyotingiz yuklanmoqda...",
            signIn: "Shaxsiy darslarni ko'rish uchun tizimga kiring",
            signInBtn: "Kirish",
            mocksTitle: "Reading Mocks",
            mocksDesc: "To'liq hajmdagi sinov imtihonlari orqali malakangizni tekshiring.",
            lessonsTitle: "Reading Darslari",
            lessonsDesc: "Reading strategiyalarini noldan o'rganing.",
            startMocks: "Boshlash",
            startLessons: "Darslarni ko'rish",
            startLesson: "Darsni boshlash",
            retake: "Qaytarish",
            lessonsHeader: "IELTS Reading Darslari",
            lessonsSubHeader: "Har qanday matnni yechish uchun asosiy qismlarni o'rganing."
        }
    };

    function t(key) {
        return translations[currentLang]?.[key] || translations.en[key] || key;
    }

    function updateLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('summage_preferred_lang', lang);
        document.documentElement.lang = lang;
        renderCurrentView();
    }

    async function loadUserData() {
        const container = document.getElementById("reading-container");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Changed from "speaking" to "reading"
                    const progressSnap = await getDoc(doc(db, "users", user.uid, "progress", "reading"));
                    completedLessons = progressSnap.exists() 
                        ? (progressSnap.data().lessons || {}) 
                        : {};
                } catch (e) {
                    console.error("Firestore error:", e);
                }
            } else {
                container.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-xl">${t('signIn')}</p>
                        <a href="/login" class="inline-block mt-6 bg-[#f24b0b] text-white font-bold py-4 px-12 rounded-3xl">${t('signInBtn')}</a>
                    </div>`;
                hideLoader();
                return;
            }
            renderCurrentView();
        });
    }

    function generateLessonGrid() {
        let cardsHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">`;
        
        allReadingLessons.forEach(l => {
            const isCompleted = !!completedLessons[l.id];
            cardsHTML += `
                <div class="lesson-card">
                    <div class="lesson-header">
                        <div class="lesson-id">LESSON ${l.id}</div>
                        <div class="lesson-title">${l.title}</div>
                        <p class="lesson-desc">${l.desc}</p>
                    </div>
                    
                    <div class="lesson-footer">
                        <a href="/learn/journeys/reading/lesson/?id=${l.id}" 
                           class="${isCompleted ? 'completed-btn' : 'start-btn'}">
                            ${isCompleted ? t('retake') : t('startLesson')}
                        </a>
                    </div>
                </div>
            `;
        });
        cardsHTML += `</div>`;
        return cardsHTML;
    }

    function renderCurrentView() {
        const container = document.getElementById("reading-container");

        if (currentView === 'selection') {
            // Main Selection View for BOTH Desktop and Mobile
            container.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        <div onclick="window.location.href='/learn/journeys/reading/mocks/'" class="lesson-card cursor-pointer group">
                            <div class="lesson-header p-8 text-center flex flex-col items-center justify-center">
                                <h2 class="text-2xl font-bold mb-3">${t('mocksTitle')}</h2>
                                <p class="text-gray-600">${t('mocksDesc')}</p>
                            </div>
                            <div class="lesson-footer text-center py-4">
                                <button class="start-btn w-full">${t('startMocks')}</button>
                            </div>
                        </div>

                        <div onclick="selectView('lessons')" class="lesson-card cursor-pointer group">
                            <div class="lesson-header p-8 text-center flex flex-col items-center justify-center">
                                <h2 class="text-2xl font-bold mb-3" style="margin-top: 20px">${t('lessonsTitle')}</h2>
                                <p class="text-gray-600">${t('lessonsDesc')}</p>
                            </div>
                            <div class="lesson-footer text-center py-4">
                                <button class="start-btn w-full">${t('startLessons')}</button>
                            </div>
                        </div>

                    </div>
                </div>`;
        } else if (currentView === 'lessons') {
            // The 6 Lessons Grid View
            container.innerHTML = `
                <div class="max-w-6xl mx-auto">
                    <div class="mb-10">
                        <div class="flex items-center gap-4 mb-8">
                            <div>
                                <h2 class="section-title">${t('lessonsHeader')}</h2>
                                <p class="section-desc">${t('lessonsSubHeader')}</p>
                            </div>
                        </div>
                        ${generateLessonGrid()}
                    </div>
                </div>
            `;
        }

        hideLoader();
    }

    window.selectView = function(viewName) {
        currentView = viewName;
        renderCurrentView();
    };

    window.goBack = function() {
        // If in lessons view, back goes to the selection menu
        if (currentView === 'lessons') {
            currentView = 'selection';
            renderCurrentView();
        } else {
            // If already in selection menu, back goes to main learning hub
            window.location.assign('/learn/');
        }
    }

    // Loader logic
    const loader = document.getElementById('pageLoader');
    const splashAnim = document.getElementById('splashPanda');

    setTimeout(() => { 
        if (splashAnim) { 
            splashAnim.style.opacity = '1'; 
            splashAnim.style.transform = 'scale(1) translateY(0)'; 
        } 
    }, 400);

    function hideLoader() {
        if (!loader || loader.classList.contains('hidden')) return;
        loader.classList.add('hidden');
        setTimeout(() => loader.remove(), 1400);
    }

    // Event listeners
    window.addEventListener('load', () => {
        loadUserData();

        // Language selector
        document.getElementById('lang-btn')?.addEventListener('click', e => {
            e.stopPropagation();
            document.getElementById('lang-flags').classList.toggle('show');
        });

        document.querySelectorAll('.flag').forEach(el => {
            el.addEventListener('click', e => {
                e.stopPropagation();
                updateLanguage(el.dataset.lang);
                document.getElementById('lang-flags').classList.remove('show');
            });
        });

        document.addEventListener('click', () => {
            document.getElementById('lang-flags').classList.remove('show');
        });
    });
    </script>
</body>
</html>
