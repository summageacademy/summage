    <script>
    // ====================== FIREBASE SETUP ======================
    let auth, db;

    async function loadFirebase() {
        const scripts = [
            'https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js',
            'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js',
            'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js'
        ];

        for (let src of scripts) {
            await new Promise(resolve => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDX73k3QqXr9xu_PKkQBkr9pUNp7zmtrW0",
            authDomain: "summage-backend.firebaseapp.com",
            projectId: "summage-backend",
            storageBucket: "summage-backend.firebasestorage.app",
            messagingSenderId: "128191434358",
            appId: "1:128191434358:web:4c9e9f4f9ff4a23db5d957"
        };

        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();

        console.log("✅ Firebase initialized");
        initAuthListener();
    }

    // ====================== GAME VARIABLES ======================
    const translations = {
        en: { back: "Back", check: "CHECK ANSWER", loading: "LOADING..." },
        ru: { back: "Назад", check: "ПРОВЕРИТЬ", loading: "ЗАГРУЗКА..." },
        uz: { back: "Orqaga", check: "TEKSHIRISH", loading: "YUKLANMOQDA..." }
    };

    let currentLang = localStorage.getItem('summage_lang') || 'en';
    document.documentElement.lang = currentLang;

    const tasks = [
        { html: "One major <strong>advantage</strong> of studying abroad is cultural exposure.", options: ["benefit", "drawback", "problem", "challenge"], correct: 0 },
        { html: "Climate change has a huge <strong>impact</strong> on global food production.", options: ["effect", "cause", "solution", "benefit"], correct: 0 },
        { html: "Education is <strong>crucial</strong> for long-term economic growth.", options: ["essential", "optional", "minor", "irrelevant"], correct: 0 },
        { html: "The government wants to <strong>increase</strong> investment in green technology.", options: ["rise", "decrease", "reduce", "lower"], correct: 0 },
        { html: "Finding a permanent <strong>solution</strong> to traffic jams is difficult.", options: ["approach", "problem", "cause", "question"], correct: 0 },
        { html: "Many countries now use <strong>renewable</strong> energy sources.", options: ["sustainable", "fossil", "nuclear", "traditional"], correct: 0 },
        { html: "Social media has a strong <strong>influence</strong> on young people's behaviour.", options: ["effect", "control", "freedom", "isolation"], correct: 0 },
        { html: "Teamwork is <strong>essential</strong> in modern workplaces.", options: ["vital", "unnecessary", "rare", "optional"], correct: 0 },
        { html: "Globalization has both positive and negative <strong>consequences</strong>.", options: ["results", "causes", "solutions", "origins"], correct: 0 },
        { html: "Governments should protect the <strong>environment</strong> more strictly.", options: ["nature", "economy", "technology", "society"], correct: 0 }
    ];

    let currentIndex = 0;
    let selectedIndex = null;
    let isChecking = false;
    let currentUser = null;
    let hearts = null;
    let lastHeartReset = null;
    let isHeartsLoaded = false;

    // Boost Variables
    let isHeartbarActive = false;
    let heartbarExpiresAt = 0;

    const fullHeart = '/assets/images/menu-icons/game-heart.webp';
    const emptyHeart = '/assets/images/menu-icons/game-heart-empty.webp';

    const promptEl = document.getElementById('prompt-text');
    const gridEl = document.getElementById('options-grid');
    const checkBtn = document.getElementById('check-btn');

    function playClick() {
        const sound = new Audio('/assets/audio/click.mp3');
        sound.volume = 0.1;
        sound.play().catch(() => {});
    }

    // ====================== HEARTS RENDER ======================
    function renderHearts() {
        if (hearts === null) return;

        const isBoosted = isHeartbarActive;

        // Desktop
        const desktopContainer = document.getElementById('hearts-container');
        desktopContainer.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
            const img = document.createElement('img');
            img.className = `heart ${isBoosted ? 'boosted' : ''}`;
            img.src = (i <= hearts) ? fullHeart : emptyHeart;
            desktopContainer.appendChild(img);
        }

        // Mobile
        const countEl = document.getElementById('hearts-count');
        if (countEl) {
            countEl.textContent = isBoosted ? '∞' : hearts;
            countEl.style.color = isBoosted ? '#fbbf24' : '#f24b0b';
        }
        document.getElementById('hearts-mobile').classList.toggle('boosted', isBoosted);
    }

    // ====================== FIREBASE HEART + BOOST SYSTEM ======================
    async function loadUserHearts() {
        if (!currentUser || !db) return;

        try {
            const userRef = db.collection("users").doc(currentUser.uid);
            const docSnap = await userRef.get();

            if (docSnap.exists) {
                const data = docSnap.data();
                hearts = data.hearts !== undefined ? data.hearts : 5;
                lastHeartReset = data.lastHeartReset || null;
                checkAndResetHearts();
            } else {
                await userRef.set({ hearts: 5, lastHeartReset: getTodayDateString() });
                hearts = 5;
            }

            isHeartsLoaded = true;
            await loadActiveBoosts();   // Load boost after hearts
            renderHearts();
        } catch (e) {
            console.error("❌ Load hearts error:", e);
            hearts = 5;
            isHeartsLoaded = true;
            renderHearts();
        }
    }

    async function loadActiveBoosts() {
        if (!currentUser || !db) return;

        try {
            const snapshot = await db.collection('purchases')
                .where('userId', '==', currentUser.uid)
                .get();

            isHeartbarActive = false;
            heartbarExpiresAt = 0;

            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.itemId === "full_heartbar" && data.expiresAt > Date.now()) {
                    isHeartbarActive = true;
                    heartbarExpiresAt = data.expiresAt;
                }
            });

            console.log("💎 Full Heartbar Active:", isHeartbarActive);
            renderHearts();
        } catch (e) {
            console.error("Boost load error:", e);
        }
    }

    function getTodayDateString() {
        return new Date().toISOString().split('T')[0];
    }

    function checkAndResetHearts() {
        const today = getTodayDateString();
        if (lastHeartReset !== today) {
            hearts = 5;
            lastHeartReset = today;
            saveUserHearts();
        }
    }

    async function saveUserHearts() {
        if (!currentUser || !db) return;
        try {
            const userRef = db.collection("users").doc(currentUser.uid);
            await userRef.set({
                hearts: hearts,
                lastHeartReset: getTodayDateString()
            }, { merge: true });
        } catch (e) {
            console.error("❌ Save hearts error:", e);
        }
    }

    function initAuthListener() {
        auth.onAuthStateChanged(user => {
            currentUser = user;
            console.log("🔐 Auth:", user ? "Logged in" : "Guest");
            if (user) {
                loadUserHearts();
            } else {
                hearts = 5;
                isHeartsLoaded = true;
                renderHearts();
            }
        });
    }

    // ====================== GAME FUNCTIONS ======================
    function updateButtonTexts() {
        const t = translations[currentLang] || translations.en;
        const backBtn = document.querySelector('.back-btn');
        if (backBtn) backBtn.innerHTML = `<span>${t.back}</span>`;

        if (checkBtn && !checkBtn.disabled) checkBtn.textContent = t.check;
    }

    function loadNewTask() {
        isChecking = false;
        selectedIndex = null;
        checkBtn.disabled = false;

        const t = translations[currentLang] || translations.en;
        checkBtn.textContent = t.check;

        let newIndex = currentIndex;
        while (newIndex === currentIndex) newIndex = Math.floor(Math.random() * tasks.length);
        currentIndex = newIndex;
        const task = tasks[currentIndex];

        promptEl.classList.remove('visible');
        setTimeout(() => {
            promptEl.innerHTML = task.html;
            promptEl.classList.add('visible');
        }, 400);

        gridEl.innerHTML = '';
        task.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.textContent = opt;
            div.dataset.index = i;
            div.onclick = () => selectOption(i);
            gridEl.appendChild(div);
        });
    }

    function selectOption(index) {
        if (isChecking) return;
        selectedIndex = index;
        document.querySelectorAll('.option').forEach(opt => {
            opt.classList.remove('selected');
            if (parseInt(opt.dataset.index) === index) opt.classList.add('selected');
        });
    }

    function correctSound() {
            const sound = new Audio('/assets/audio/correct.mp3');
            sound.volume = 0.1;
            sound.play().catch(() => {});
        }

    function incorrectSound() {
            const sound = new Audio('/assets/audio/error.mp3');
            sound.volume = 0.1;
            sound.play().catch(() => {});
        }
    
    function checkAnswer() {
        if (isChecking || selectedIndex === null) return;
        if (!canPlay()) {
            document.getElementById('game-over-modal').style.display = 'flex';
            return;
        }

        isChecking = true;
        checkBtn.disabled = true;
        const t = translations[currentLang] || translations.en;
        checkBtn.textContent = t.loading;

        const task = tasks[currentIndex];
        const isCorrect = selectedIndex === task.correct;

        // Visual feedback
        document.querySelectorAll('.option').forEach(opt => {
            const idx = parseInt(opt.dataset.index);
            opt.classList.remove('selected');

            if (idx === task.correct) {
                opt.classList.add('correct');
            }

            if (idx === selectedIndex && !isCorrect) {
                opt.classList.add('wrong');
            }
        });

        // Play sounds OUTSIDE the loop - only once
        if (isCorrect) {
            correctSound();
        } else {
            incorrectSound();
            
            if (!isHeartbarActive) {
                hearts = Math.max(0, hearts - 1);
                renderHearts();
                saveUserHearts();
            }

            if (hearts <= 0 && !isHeartbarActive) {
                setTimeout(() => {
                    document.getElementById('game-over-modal').style.display = 'flex';
                }, 1400);
                return;
            }
        }

        setTimeout(loadNewTask, 2200);
    }

    // ====================== MODALS & HEARTS LOGIC ======================
    let countdownInterval = null;

    function closeGameOverModal() {
        document.getElementById('game-over-modal').style.display = 'none';
        // IMPORTANT: Do NOT reset hearts here
    }

    function watchAdForHearts() {
        document.getElementById('game-over-modal').style.display = 'none';
        document.getElementById('ad-modal').style.display = 'flex';
        startAdCountdown();
    }

    function closeAdModal() {
        document.getElementById('ad-modal').style.display = 'none';
        // Optional: allow user to close ad but they still have 0 hearts
    }

    function finishAdAndContinue() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        
        document.getElementById('ad-modal').style.display = 'none';
        
        hearts = Math.min(5, (hearts || 0) + 3);
        renderHearts();
        saveUserHearts();
        loadNewTask();
    }

    function startAdCountdown() {
        const continueBtn = document.getElementById('continue-btn');
        let timeLeft = 5;
        
        continueBtn.disabled = true;
        continueBtn.style.background = '#9ca3af';
        continueBtn.style.boxShadow = '0 4px 0 #6b7280';
        continueBtn.textContent = "5";
        
        if (countdownInterval) clearInterval(countdownInterval);
        
        countdownInterval = setInterval(() => {
            timeLeft--;
            continueBtn.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                continueBtn.textContent = "CONTINUE PLAYING";
                continueBtn.disabled = false;
                continueBtn.style.background = '#10b981';
                continueBtn.style.boxShadow = '0 4px 0 #0b9265';
            }
        }, 1000);
    }

    function canPlay() {
        return hearts > 0 || isHeartbarActive;   // ← Updated
    }

    // ====================== INITIALIZE ======================
    checkBtn.addEventListener('click', checkAnswer);

    loadFirebase();

    // Initial render
    loadNewTask();
    updateButtonTexts();

    // Splash screen logic
        const loader = document.getElementById('pageLoader');
        const owl = document.getElementById('splashOwl');

        const MIN_DURATION = 1500;
        let minTimePassed = false;

        setTimeout(() => {
            if (owl) {
                owl.style.opacity = '1';
                owl.style.transform = 'scale(1) translateY(0)';
            }
        }, 400);

        setTimeout(() => {
            minTimePassed = true;
            if (document.readyState === 'complete') hideLoader();
        }, MIN_DURATION);

        window.addEventListener('load', () => {
            if (minTimePassed) {
                hideLoader();
            } else {
                setTimeout(hideLoader, MIN_DURATION);
            }
        });

        function hideLoader() {
            if (loader.classList.contains('hidden')) return;
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 1400);
        }

        setTimeout(() => hideLoader(), 7000);
</script>
