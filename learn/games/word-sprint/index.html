    }

    function goBack() {
        const before = window.location.href;
        
        history.back();
        
        setTimeout(() => {
            if (window.location.href === before) {
                window.location.assign('/learn/');
            }
        }, 50);
    }

    function handleKeyPress(key) {
        if (isChecking) return;
        playClick();

        if (key === '⌫') {
            typedAnswer = typedAnswer.slice(0, -1);
        } else {
            if (typedAnswer.length < 15) {
                typedAnswer += key;
            }
        }
        renderAnswer();
    }

    function renderAnswer() {
        const t = translations[currentLang] || translations.en;
        if (typedAnswer.length === 0) {
            displayEl.textContent = t.empty;
            displayEl.style.opacity = "0.4";
        } else {
            displayEl.textContent = typedAnswer;
            displayEl.style.opacity = "1";
        }
    }

    // Prevent default desktop keys so everything operates entirely through the virtual custom layer
    window.addEventListener('keydown', (e) => {
        if (e.key === "Backspace") { 
            handleKeyPress('⌫'); 
            e.preventDefault(); 
        }
        if (e.key === "Enter") { 
            checkAnswer(); 
            e.preventDefault(); 
        }
        const keyUpper = e.key.toUpperCase();
        if (keyUpper.length === 1 && keyUpper >= 'A' && keyUpper <= 'Z') {
            handleKeyPress(keyUpper);
            e.preventDefault();
        }
    });

    // ====================== GAME RUNTIME ======================
    function loadNewTask() {
        isChecking = false;
        typedAnswer = "";
        checkBtn.disabled = false;
        displayEl.className = "answer-box flex items-center justify-center";
        
        const t = translations[currentLang] || translations.en;
        checkBtn.textContent = t.check;

        let newIndex = currentIndex;
        while (newIndex === currentIndex) newIndex = Math.floor(Math.random() * tasks.length);
        currentIndex = newIndex;
        
        const task = tasks[currentIndex];
        promptEl.classList.remove('visible');
        
        setTimeout(() => {
            promptEl.innerHTML = `Translate: <strong>${task[currentLang] || task['uz']}</strong>`;
            promptEl.classList.add('visible');
            renderAnswer();
        }, 300);
    }

    function checkAnswer() {
        if (isChecking || typedAnswer.length === 0) return;
        if (hearts <= 0 && !isHeartbarActive) {
            document.getElementById('game-over-modal').style.display = 'flex';
            return;
        }

        isChecking = true;
        checkBtn.disabled = true;
        const t = translations[currentLang] || translations.en;
        checkBtn.textContent = t.loading;

        const task = tasks[currentIndex];
        const isCorrect = task.correct.includes(typedAnswer.trim().toUpperCase());

        if (isCorrect) {
            correctSound();
            displayEl.classList.add('correct');
            setTimeout(loadNewTask, 1600);
        } else {
            incorrectSound();
            displayEl.classList.add('wrong');
            displayEl.textContent = task.correct[0]; // show only the primary correct answer // reveal correct answer brief flash
            
            if (!isHeartbarActive) {
                hearts = Math.max(0, hearts - 1);
                renderHearts();
                saveUserHearts();
            }

            if (hearts <= 0 && !isHeartbarActive) {
                setTimeout(() => {
                    document.getElementById('game-over-modal').style.display = 'flex';
                }, 1400);
                return;
            }
            setTimeout(loadNewTask, 2000);
        }
    }

    // ====================== HEARTS LOGIC ======================
    function renderHearts() {
        if (hearts === null) return;
        const isBoosted = isHeartbarActive;

        const desktopContainer = document.getElementById('hearts-container');
        desktopContainer.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
            const img = document.createElement('img');
            img.className = `heart ${isBoosted ? 'boosted' : ''}`;
            img.src = (i <= hearts) ? fullHeart : emptyHeart;
            desktopContainer.appendChild(img);
        }

        const countEl = document.getElementById('hearts-count');
        if (countEl) {
            countEl.textContent = isBoosted ? '∞' : hearts;
            countEl.style.color = isBoosted ? '#fbbf24' : '#f24b0b';
        }
        document.getElementById('hearts-mobile').classList.toggle('boosted', isBoosted);
    }

    async function loadUserHearts() {
        if (!currentUser || !db) return;
        try {
            const userRef = db.collection("users").doc(currentUser.uid);
            const docSnap = await userRef.get();
            if (docSnap.exists) {
                const data = docSnap.data();
                hearts = data.hearts !== undefined ? data.hearts : 5;
                lastHeartReset = data.lastHeartReset || null;
                checkAndResetHearts();
            } else {
                await userRef.set({ hearts: 5, lastHeartReset: getTodayDateString() });
                hearts = 5;
            }
            await loadActiveBoosts();
            renderHearts();
        } catch (e) {
            hearts = 5; renderHearts();
        }
    }

    async function loadActiveBoosts() {
        if (!currentUser || !db) return;
        try {
            const snapshot = await db.collection('purchases').where('userId', '==', currentUser.uid).get();
            isHeartbarActive = false;
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.itemId === "full_heartbar" && data.expiresAt > Date.now()) { isHeartbarActive = true; }
            });
            renderHearts();
        } catch (e) {}
    }

    function getTodayDateString() { return new Date().toISOString().split('T')[0]; }
    function checkAndResetHearts() {
        const today = getTodayDateString();
        if (lastHeartReset !== today) { hearts = 5; lastHeartReset = today; saveUserHearts(); }
    }
    async function saveUserHearts() {
        if (!currentUser || !db) return;
        try {
            await db.collection("users").doc(currentUser.uid).set({ hearts: hearts, lastHeartReset: getTodayDateString() }, { merge: true });
        } catch (e) {}
    }

    function initAuthListener() {
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) { loadUserHearts(); } else { hearts = 5; renderHearts(); }
        });
    }

    // ====================== AD HANDLERS ======================
    let countdownInterval = null;
    function watchAdForHearts() {
        document.getElementById('game-over-modal').style.display = 'none';
        document.getElementById('ad-modal').style.display = 'flex';
        startAdCountdown();
    }
    function finishAdAndContinue() {
        if (countdownInterval) clearInterval(countdownInterval);
        document.getElementById('ad-modal').style.display = 'none';
        hearts = Math.min(5, (hearts || 0) + 3);
        renderHearts();
        saveUserHearts();
        loadNewTask();
    }
    function startAdCountdown() {
        const continueBtn = document.getElementById('continue-btn');
        let timeLeft = 5;
        
        continueBtn.disabled = true;
        continueBtn.style.background = '#9ca3af';
        continueBtn.style.boxShadow = '0 4px 0 #6b7280'; // gray shadow
        continueBtn.textContent = "5";
        
        if (countdownInterval) clearInterval(countdownInterval);
        
        countdownInterval = setInterval(() => {
            timeLeft--;
            continueBtn.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                continueBtn.textContent = "CONTINUE PLAYING";
                continueBtn.disabled = false;
                continueBtn.style.background = '#10b981';
                continueBtn.style.boxShadow = '0 4px 0 #0b9265'; // green shadow restored
            }
        }, 1000);
    }

    // ====================== INITIALIZE ======================
    checkBtn.addEventListener('click', checkAnswer);
    buildKeyboard();
    loadFirebase();
    loadNewTask();

    // Hide loader
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('pageLoader');
            if (loader) { loader.classList.add('hidden'); setTimeout(() => loader.remove(), 1000); }
        }, 1200);
    });
</script>
