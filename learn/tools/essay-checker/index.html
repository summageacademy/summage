  <script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDX73k3QqXr9xu_PKkQBkr9pUNp7zmtrW0",
        authDomain: "summage-backend.firebaseapp.com",
        projectId: "summage-backend",
        storageBucket: "summage-backend.firebasestorage.app",
        messagingSenderId: "128191434358",
        appId: "1:128191434358:web:4c9e9f4f9ff4a23db5d957"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let lastEssayCheckTime = 0;

    // Language System
    const translations = {
      en: {
        aiHeroTitle: "Essay Checker",
        aiHeroSubtitle: "Get IELTS band score estimates, detailed feedback and improvement suggestions for Task 1 and Task 2 essays",
        aiAnalyzeBtn: "Check Essay"
      },
      ru: {
        aiHeroTitle: "Essay Checker",

        aiAnalyzeBtn: "Проверить эссе"
      },
      uz: {
        aiHeroTitle: "Essay Checker",
        aiHeroSubtitle: "Task 1 va Task 2 essays uchun taxminiy IELTS band score va tavsiyalar oling.",
        aiAnalyzeBtn: "Esseni tekshirish"
      }
    };

    let currentTask = "task2";
    let currentLang = localStorage.getItem('summage_preferred_lang') || 'en';

    // Check if user has active Essay Checking Boost
    async function hasActiveEssayBoost() {
        if (!currentUser) {
            console.warn("User not logged in yet");
            return false;
        }

        try {
            const snapshot = await db.collection('purchases')
                .where('userId', '==', currentUser.uid)
                .where('itemId', '==', 'essay_checking')
                .get();

            let hasBoost = false;
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.expiresAt > Date.now()) {
                    hasBoost = true;
                }
            });
            return hasBoost;
        } catch (e) {
            console.error("Error checking boost:", e);
            return false;
        }
    }

    function playClick() {
        const sound = new Audio('/assets/audio/click.mp3');
        sound.volume = 0.1;
        sound.play().catch(() => {});
    }

    // ==================== CUSTOM NOTIFICATION SYSTEM ====================
    function showNotification(message, type = "info") {
      const modal = document.getElementById('notification-modal');
      const icon = document.getElementById('notification-icon');
      const msgEl = document.getElementById('notification-message');

      msgEl.textContent = message;

      // Set icon and color based on type
      switch(type) {
        case "error":
          icon.innerHTML = "❌";
          icon.style.color = "#f24b0b";
          break;
        case "success":
          icon.innerHTML = "✅";
          icon.style.color = "#06a87c";
          break;
        case "warning":
          icon.innerHTML = "⚠️";
          icon.style.color = "#f59e0b";
          break;
        default:
          icon.innerHTML = "ℹ️";
          icon.style.color = "#3b82f6";
      }

      modal.style.display = 'flex';
    }

    function hideNotification() {
      document.getElementById('notification-modal').style.display = 'none';
    }

    // Auto hide after 6 seconds (optional)
    setTimeout(() => {
      const modal = document.getElementById('notification-modal');
      if (modal.style.display === 'flex') {
        hideNotification();
      }
    }, 6000);
    
    // Task Selector
    document.querySelectorAll('.task-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.task-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentTask = btn.dataset.task;

        const imageContainer = document.getElementById('task1-image-container');
        if (imageContainer) {
          imageContainer.style.display = currentTask === "task1" ? "block" : "none";
        }
      });
    });

    // Image Size Validation (7MB)
    // Image Validation + Selected File Display
    const imageInput = document.getElementById("task1-image");
    const selectedFileDiv = document.getElementById("selected-file");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      
      if (!file) {
        selectedFileDiv.style.display = "none";
        return;
      }

      if (file.size > 7 * 1024 * 1024) {
        showNotification("Maximum image size is 7 MB.", "error");
        imageInput.value = "";
        selectedFileDiv.style.display = "none";
        return;
      }

      // Show selected filename
      selectedFileDiv.textContent = `Selected: ${file.name}`;
      selectedFileDiv.style.display = "flex";
    });

    // Image Compression (Recommended for Gemini)
    async function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const reader = new FileReader();

        reader.onload = e => {
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxWidth = 1400;
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressed = canvas.toDataURL("image/jpeg", 0.82);
            resolve(compressed.split(",")[1]);
          };
          img.src = e.target.result;
        };

        reader.readAsDataURL(file);
      });
    }

    // Update Language
    function updateLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('summage_preferred_lang', lang);
      document.querySelectorAll('[data-lang-key]').forEach(el => {
        const key = el.dataset.langKey;
        if (translations[lang]?.[key]) {
          el.textContent = translations[lang][key];
        }
      });
    }

    // Back Function
    function goBack() {
      history.back();
      setTimeout(() => {
        if (window.location.href === document.referrer) {
          window.location.assign('/learn/');
        }
      }, 100);
    }

    // Modal Functions
    function showModal() {
      document.getElementById('results-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('results-modal').style.display = 'none';
    }

        // Main Check Essay Handler with Cooldown Logic
    document.getElementById('check-btn').addEventListener('click', async () => {
      const essay = document.getElementById('essay-text').value.trim();
      if (!essay) {
        showNotification("Please write or paste your essay first.", "warning");
        return;
      }

      const now = Date.now();
      const hasBoost = await hasActiveEssayBoost();

      // Cooldown check (60 minutes = 3600000 ms)
      if (!hasBoost && (now - lastEssayCheckTime < 3600000)) {
        const remainingMinutes = Math.ceil((3600000 - (now - lastEssayCheckTime)) / 60000);
        showNotification(`⏳ You have used your free check.\nPlease wait ${remainingMinutes} minutes or purchase the Unlimited Essay Checking boost.`, "warning");
        return;
      }

      const checkBtn = document.getElementById('check-btn');
      checkBtn.textContent = "Analyzing with Gemini...";
      checkBtn.disabled = true;

      try {
        const topic = document.getElementById('essay-topic').value.trim();
        const imageFile = imageInput.files[0];

        let prompt = "";
        let requestBody = {};

        if (currentTask === "task1") {
          prompt = `You are a certified IELTS Academic Writing Task 1 examiner.

The user has provided:
1. Task 1 question.
2. Task 1 chart/image.
3. Student response.

First determine whether the uploaded image is genuinely an IELTS Task 1 visual (bar chart, line graph, table, pie chart, process diagram, map, mixed chart, etc.) or unrelated/invalid.

Return ONLY valid JSON with this structure:
{
  "imageIssue": false,
  "imageIssueFeedback": "",
  "taskResponse": { "score": 7.0, "feedback": "" },
  "coherence": { "score": 7.5, "feedback": "" },
  "lexical": { "score": 7.0, "feedback": "" },
  "grammar": { "score": 7.5, "feedback": "" },
  "overallBand": 7.0,
  "mistakes": ["..."],
  "improvements": ["..."]
}`;

          const parts = [{ text: prompt + `\n\nTopic/Question: ${topic || "Not provided"}\n\nEssay:\n"""${essay}"""` }];

          if (imageFile) {
            const compressedBase64 = await compressImage(imageFile);
            parts.push({
              inline_data: {
                mime_type: "image/jpeg",
                data: compressedBase64
              }
            });
          }

          requestBody = { contents: [{ parts: parts }] };

        } else {
          prompt = `You are a certified IELTS examiner.

Evaluate this IELTS Academic Writing Task 2 essay.

Topic/Question: ${topic || "Not provided"}

Essay: """${essay}"""

Return ONLY valid JSON with this structure:
{
  "taskResponse": { "score": 7.5, "feedback": "" },
  "coherence": { "score": 8.0, "feedback": "" },
  "lexical": { "score": 7.0, "feedback": "" },
  "grammar": { "score": 7.5, "feedback": "" },
  "overallBand": 7.5,
  "mistakes": ["Example mistake"],
  "improvements": ["Example suggestion"]
}`;

          requestBody = { contents: [{ parts: [{ text: prompt }] }] };
        }

        const response = await fetch(
          "https://summage-ai.summage-socials.workers.dev",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
          }
        );

        console.log("Worker Status:", response.status);

        if (!response.ok) {
          const errorText = await response.text();
          console.error("Worker Error Response:", errorText);
          throw new Error(`API Error: ${response.status}`);
        }

        const rawText = await response.text();
        console.log("Raw AI Response:", rawText);

        let resultText = rawText;

        // Clean markdown code blocks
        resultText = resultText.replace(/```json|```/g, '').trim();

        let analysis;
        try {
          // Handle nested structure from Gemini
          const parsed = JSON.parse(resultText);
          if (parsed.candidates && parsed.candidates[0]) {
            const textContent = parsed.candidates[0].content.parts[0].text;
            analysis = JSON.parse(textContent.replace(/```json|```/g, '').trim());
          } else {
            analysis = parsed;
          }
        } catch (e) {
          console.error("JSON Parse Error. Raw text:", resultText);
          throw new Error("AI response was not valid JSON");
        }

        renderResults(analysis);

        // SUCCESS: Update last check time
        lastEssayCheckTime = Date.now();

      } catch (err) {
        console.error(err);
        showNotification("Failed to analyze. Please try again.", "error");
      } finally {
        checkBtn.textContent = "Check Essay";
        checkBtn.disabled = false;
      }
    });

    // Show selected filename
    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) return;

      if (file.size > 7 * 1024 * 1024) {
        showNotification("Maximum image size is 7 MB.", "error");
        imageInput.value = "";
        return;
      }

      // Show filename
      const container = document.getElementById('task1-image-container');
      container.setAttribute('data-filename', `Selected: ${file.name}`);
    });

    function renderResults(analysis) {
      const grid = document.getElementById('criteria-grid');
      grid.innerHTML = `
        <div class="criteria-card">
          <h3>Task Response</h3>
          <div class="score">${analysis.taskResponse?.score || analysis.overallBand || 0}</div>
          <p>${analysis.taskResponse?.feedback || ""}</p>
        </div>
        <div class="criteria-card">
          <h3>Coherence & Cohesion</h3>
          <div class="score">${analysis.coherence?.score || 0}</div>
          <p>${analysis.coherence?.feedback || ""}</p>
        </div>
        <div class="criteria-card">
          <h3>Lexical Resource</h3>
          <div class="score">${analysis.lexical?.score || 0}</div>
          <p>${analysis.lexical?.feedback || ""}</p>
        </div>
        <div class="criteria-card">
          <h3>Grammatical Range</h3>
          <div class="score">${analysis.grammar?.score || 0}</div>
          <p>${analysis.grammar?.feedback || ""}</p>
        </div>
      `;

      const list = document.getElementById('feedback-list');
      let html = '';

      if (analysis.mistakes && analysis.mistakes.length) {
        analysis.mistakes.forEach(m => {
          html += `<li class="feedback-item">❌ ${m}</li>`;
        });
      }

      if (analysis.improvements && analysis.improvements.length) {
        analysis.improvements.forEach(i => {
          html += `<li class="feedback-item" style="background:#f0fdf4;border-left-color:#10b981;">💡 ${i}</li>`;
        });
      }

      list.innerHTML = html || '<li class="feedback-item">No specific feedback available.</li>';

      showModal();
    }

    // Firebase Auth
    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (!user) {
            auth.signInAnonymously();
        }
    });

    // Initialize
    updateLanguage(currentLang);

    // Splash screen logic
        const loader = document.getElementById('pageLoader');
        const owl = document.getElementById('splashOwl');

        const MIN_DURATION = 1200;
        let minTimePassed = false;

        setTimeout(() => {
            if (owl) {
                owl.style.opacity = '1';
                owl.style.transform = 'scale(1) translateY(0)';
            }
        }, 300);

        setTimeout(() => {
            minTimePassed = true;
            if (document.readyState === 'complete') hideLoader();
        }, MIN_DURATION);

        window.addEventListener('load', () => {
            if (minTimePassed) hideLoader();
            else setTimeout(hideLoader, MIN_DURATION);
        });

        function hideLoader() {
            if (loader.classList.contains('hidden')) return;
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 1200);
        }
  </script>
</body>
</html>
