        .logo-img {

            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .card-content {
            padding: 32px 28px;
            flex: 1;
        }

            font-size: 1.55rem;

            color: #222;
            margin-bottom: 14px;
        }

            align-items: center;

            font-weight: 600;
            font-size: 15px;

            background: #7d2eeb;
            color: white;
            border: none;
            border-radius: 50px;

        /* ── CUSTOM TOAST NOTIFICATION ───────────────────────────────── */

            left: 50%;

            align-items: center;

            border: 1px solid #e5e7eb;

            visibility: hidden;

            pointer-events: none;

    <script>
        const BASE_PATH = "/assets/ielts_task1_pro/";

        function getUrlParameter(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function playClick() {
            const sound = new Audio('/assets/audio/click.mp3');
            sound.volume = 0.1;
            sound.play().catch(() => {});
        }

        // Improved Copy Function with Fallback
        async function copyToClipboard(text) {
            if (!text) {
                showToast('Nothing to copy', 'error');
                return;
            }

            try {
                // Primary method
                await navigator.clipboard.writeText(text);
                playClick()
                showToast('Prompt copied to clipboard!', 'success');
            } catch (err) {
                console.warn('Clipboard API failed, trying fallback...', err);
                
                // Fallback method (works better in many cases)
                try {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);

                    if (successful) {
                        playClick()
                        showToast('Prompt copied to clipboard!', 'success');
                    } else {
                        throw new Error('execCommand failed');
                    }
                } catch (fallbackErr) {
                    console.error('Both copy methods failed', fallbackErr);
                    showToast('Failed to copy. Please select and copy manually.', 'error');
                }
            }
        }

        function correctSound() {
            const sound = new Audio('/assets/audio/correct.mp3');
            sound.volume = 0.1;
            sound.play().catch(() => {});
        }

        function incorrectSound() {
                const sound = new Audio('/assets/audio/error.mp3');
                sound.volume = 0.1;
                sound.play().catch(() => {});
            }

        // Toast Function (Make sure this is updated too)
        function showToast(message, type = 'success', duration = 3000) {
            const toast = document.getElementById('customToast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');

            toast.classList.remove('toast-success', 'toast-error', 'show');

            if (type === 'success') {
                icon.src = '/assets/images/menu-icons/check.png';
                correctSound()
                toast.classList.add('toast-success');
            } else {
                icon.src = '/assets/images/menu-icons/close.png';
                incorrectSound()
                toast.classList.add('toast-error');
            }

            msg.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Download Image
        function downloadImage() {
            const img = document.getElementById('practiceImage');
            if (!img || !img.src) {
                showToast('No image to download', 'error');
                return;
            }

            const link = document.createElement('a');
            link.href = img.src;
            link.download = `IELTS_Task1_${new Date().toISOString().slice(0,10)}_Summage_Academy.webp`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('Image downloaded successfully!', 'success');
        }

        async function loadTask1Graphs() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            for (let i = 1; i <= 50; i++) {
                const num = String(i).padStart(3, '0');
                const imagePath = `${BASE_PATH}task1_${num}.webp`;

                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <img src="${imagePath}" class="card-image" 
                         onerror="this.style.opacity='0.4'; this.src='/assets/logo.webp';">
                    <div class="card-content" onclick="playClick()">
                        <div class="card-title">Task ${i}</div>
                        <div class="card-desc">Click to practice summarizing this graph</div>
                    </div>
                `;
                card.onclick = () => openTask1Practice(i);
                container.appendChild(card);
            }
        }

        async function openTask1Practice(index) {
            const num = String(index).padStart(3, '0');
            const imagePath = `${BASE_PATH}task1_${num}.webp`;
            const promptPath = `${BASE_PATH}task1_${num}_prompt.txt`;

            document.getElementById('listView').style.display = 'none';
            document.getElementById('practiceView').style.display = 'flex';
            document.getElementById('stickyBottom').style.display = 'flex';

            document.getElementById('practiceImage').src = imagePath;
            document.getElementById('downloadBtn').style.display = 'block';

            // Load Prompt
            const promptBox = document.getElementById('promptBox');
            promptBox.innerHTML = `<p><em>Loading prompt from file...</em></p>`;

            try {
                const response = await fetch(promptPath, { cache: 'no-cache' });
                
                if (response.ok) {
                    let promptText = await response.text();
                    promptText = promptText.trim();

                    promptBox.innerHTML = `
                        <h2 style="color:#06a87c; margin-bottom:20px;">IELTS Writing Task 1</h2>
                        <div style="white-space: pre-line; line-height: 1.85; margin-bottom: 40px;">${promptText}</div>
                        <p style="margin-bottom: 20px; color:#06a87c; font-weight:600;">Write at least 150 words.</p>
                        <button id="copyBtn" class="copy-btn">Copy Prompt</button>
                    `;

                    // Attach event listener after inserting HTML
                    document.getElementById('copyBtn').addEventListener('click', () => {
                        copyToClipboard(promptText);
                    });

                } else {
                    throw new Error();
                }
            } catch (error) {
                console.warn("Could not load prompt file:", error);

                    <button id="copyBtn" onclick="playClick()" class="copy-btn">Copy Prompt</button>
                `;

                document.getElementById('copyBtn').addEventListener('click', () => {
                    copyToClipboard(defaultPrompt);
                });
            }
        }

        function loadTask2Prompts() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            task2Prompts.forEach(item => {
                const card = document.createElement('div');
                card.className = 'task-card';
                card.innerHTML = `
                    <div class="card-content" style="padding: 50px 28px;" onclick="playClick()">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.prompt}</div>
                    </div>
                `;
                card.onclick = () => openTask2Practice(item);
                container.appendChild(card);
            });
        }

        function openTask2Practice(item) {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('practiceView').style.display = 'flex';
            document.getElementById('stickyBottom').style.display = 'flex';

            document.getElementById('practiceImage').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';

            const promptBox = document.getElementById('promptBox');
            
            promptBox.innerHTML = `
                <h2 style="color:#06a87c; margin-bottom:20px;">IELTS Writing Task 2</h2>
                <p><strong>${item.title}</strong></p>
                <p style="margin-top: 24px; line-height: 1.8;">${item.prompt}</p>
                <p style="margin-top: 35px; color:#06a87c; font-weight:600;">Write at least 250 words.</p>
                <button id="copyBtn" class="copy-btn">Copy Prompt</button>
            `;

            // Attach listener
            document.getElementById('copyBtn').addEventListener('click', () => {
                copyToClipboard(item.prompt);
            });
        }

        function backToList() {
            document.getElementById('listView').style.display = 'block';
            document.getElementById('practiceView').style.display = 'none';
            document.getElementById('stickyBottom').style.display = 'none';
            document.getElementById('practiceImage').style.display = 'block';
        }

        function goBack() {
            history.back();
        }

        // Initialize
        window.onload = () => {
            const id = getUrlParameter('id') || 'task1';
            
            if (id.toLowerCase() === 'task2') {
                document.getElementById('pageTitle').textContent = "IELTS Writing Task 2";
                document.getElementById('pageSubtitle').textContent = "Practice full essay writing with strong arguments";
                loadTask2Prompts();
            } else {
                loadTask1Graphs();
            }
        };

        // Splash screen logic
        const loader = document.getElementById('pageLoader');
        const owl = document.getElementById('splashOwl');

        const MIN_DURATION = 1200;
        let minTimePassed = false;

        setTimeout(() => {
            if (owl) {
                owl.style.opacity = '1';
                owl.style.transform = 'scale(1) translateY(0)';
            }
        }, 300);

        setTimeout(() => {
            minTimePassed = true;
            if (document.readyState === 'complete') hideLoader();
        }, MIN_DURATION);

        window.addEventListener('load', () => {
            if (minTimePassed) hideLoader();
            else setTimeout(hideLoader, MIN_DURATION);
        });

        function hideLoader() {
            if (loader.classList.contains('hidden')) return;
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 1200);
        }
    </script>
