<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay Tasks - Summage Academy</title>
    <meta name="description" content="Select your learning task">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LZP4KSPR1V"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
    
        gtag('config', 'G-LZP4KSPR1V');
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html {
            overflow-y: scroll;
            scrollbar-width: none;
        }
        html::-webkit-scrollbar {
            display: none;
        }

        body {
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5vw;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: scale(1.02);
        }

        .logo-img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 4px 12px rgba(242, 75, 11, 0.18);
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            color: #f24b0b;
            text-transform: uppercase;
            letter-spacing: 1.4px;
        }

        .back-btn {
            padding: 12px 32px;
            background: #f1192e;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c40e20;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c40e20;
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-container {
            flex: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 100px 5vw 140px;
            width: 100%;
            text-align: center;
        }

        .page-title {
            font-size: 2.6rem;
            font-weight: 800;
            color: #06a87c;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 1.35rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 70px;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 32px;
            width: 100%;
        }

        .task-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 0, 0, 0.04);
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .task-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
        }

        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card-content {
            padding: 32px 28px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-content h3 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 14px;
            letter-spacing: -0.3px;
        }

        .card-content p {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.65;
            flex: 1;
        }

        .card-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .start-btn {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #06a87c;
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #058f68;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            background: #05a079;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #058f68;
        }

        /* Loader */
        .page-loader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #splashOwl {
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 768px) {
            .tasks-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .main-container {
                padding: 80px 5vw 100px;
            }
            .page-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

  <div id="pageLoader" class="page-loader">
        <lottie-player 
            id="splashOwl"
            src="/assets/Sandy Loading.json"
            background="transparent" 
            speed="0.9" 
            style="width: 120px; height: 120px; opacity: 0; transform: scale(0.7) translateY(20px);"
            loop 
            autoplay>
        </lottie-player>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo-container" onclick="window.location.href='https://summage.org'">
            <img class="logo-img" src="/assets/logo.webp" alt="Summage Academy Logo">
            <div class="logo-text">Summage</div>
        </div>
        <button class="back-btn" onclick="window.location.href = '/learn/'">Back</button>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div id="initial-header">
            <h1 class="page-title">Choose Your IELTS Task</h1>
            <p class="page-subtitle">
                Select the writing task you would like to practice today
            </p>
        </div>

        <div class="tasks-grid">
            <!-- Task 1 -->
            <div class="task-card">
                <img src="/assets/ielts_task1_pro/task1_002.webp" alt="IELTS Writing Task 1" class="card-image">
                <div class="card-content">
                    <h3>Writing Task 1</h3>
                    <p>
                        Practice describing charts, graphs, maps, processes and visual data.
                    </p>
                    <div class="card-footer" onclick="goToTask(1)">
                        <button class="start-btn">Start Task 1 Practice</button>
                    </div>
                </div>
            </div>

            <!-- Task 2 -->
            <div class="task-card">
                <img src="/assets/images/task2.webp" alt="IELTS Writing Task 2" class="card-image">
                <div class="card-content">
                    <h3>Writing Task 2</h3>
                    <p>
                        Practice opinion, discussion, problem-solution and argumentative essays.
                    </p>
                    <div class="card-footer" onclick="goToTask(2)">
                        <button class="start-btn">Start Task 2 Practice</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function goToTask(taskNumber) {
            window.location.href = `/learn/tools/essay-tasks/tasks/?id=task${taskNumber}`;
        }

        function goBack() {
            const before = window.location.href;
            history.back();
            setTimeout(() => {
                if (window.location.href === before) {
                    window.location.assign('/learn/');
                }
            }, 50);
        }

        // Splash screen logic
        const loader = document.getElementById('pageLoader');
        const owl = document.getElementById('splashOwl');

        const MIN_DURATION = 1200;
        let minTimePassed = false;

        setTimeout(() => {
            if (owl) {
                owl.style.opacity = '1';
                owl.style.transform = 'scale(1) translateY(0)';
            }
        }, 300);

        setTimeout(() => {
            minTimePassed = true;
            if (document.readyState === 'complete') hideLoader();
        }, MIN_DURATION);

        window.addEventListener('load', () => {
            if (minTimePassed) hideLoader();
            else setTimeout(hideLoader, MIN_DURATION);
        });

        function hideLoader() {
            if (loader.classList.contains('hidden')) return;
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 1200);
        }
    </script>
</body>
</html>
