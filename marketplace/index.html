    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html {
            overflow-y: scroll;
            scrollbar-width: none;
        }
        html::-webkit-scrollbar { display: none; }

        body {
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 5vw;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .back-btn {
            padding: 12px 28px;
            background: #f1192e;
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c40e20;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c40e20;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(242, 75, 11, 0.15);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            color: #f24b0b;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        /* Marketplace */
        .marketplace-container {
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 5vw 120px;
            width: 100%;
        }

        .marketplace-title {
            font-size: 2.6rem;
            font-weight: 800;
            color: #06a87c;
            text-align: center;
            margin-bottom: 12px;
        }

        .marketplace-subtitle {
            font-size: 1.3rem;
            color: #555;
            text-align: center;
            margin-bottom: 60px;
        }

        .marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
        }

        .item-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.09);
            transition: all 0.3s ease;
        }

        .item-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.13);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
            text-align: center;
        }

        .item-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #222;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #06a87c;
            margin-bottom: 18px;
        }

        .buy-btn {
            width: 100%;
            padding: 14px;
            background: #06a87c;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 #048f68;
            transition: all 0.25s ease;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #048f68;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            max-width: 480px;
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 32px;
            color: #888;
            cursor: pointer;
            z-index: 10;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .modal-body {
            padding: 24px;
            text-align: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #06a87c;
            margin: 16px 0;
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid #eee;
        }

        .confirm-btn {
            width: 100%;
            padding: 16px;
            background: #f24b0b;
            box-shadow: 0 4px 0 #c23a0a;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c23a0a;
        }

        .close-ad-button {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c23a0a
        }

        footer {
            background: #1a1a1a;
            color: #ccc;
            padding: 80px 5vw 40px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
        }

        .footer-column h3 {
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer-column ul {
            list-style: none;
        }

        .footer-column a {
            color: #ccc;
            text-decoration: none;
            line-height: 2;
            display: block;
            transition: color 0.3s;
        }

        .footer-column a:hover {
            color: #f24b0b;
        }

        .footer-bottom {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #333;
            text-align: center;
            color: #888;
        }

        /* ── CUSTOM TOAST NOTIFICATION ───────────────────────────────── */
        .custom-toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
            padding: 16px 20px;
            max-width: 380px;
            width: 90%;
            z-index: 3000;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #e5e7eb;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            bottom: 30px;
        }

        .custom-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-8px);
            pointer-events: all;
        }

        @media (max-width: 768px) {
            .custom-toast { bottom: 88px; }
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        .toast-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: contain;
            flex-shrink: 0;
            padding: 2px;
        }

        .toast-message {
            font-size: 1.02rem;
            font-weight: 500;
            color: #1f2937;
            line-height: 1.45;
            flex: 1;
        }

        .toast-success {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .toast-success .toast-icon {
            background: #ecfdf5;
            border: 2px solid #10b981;
        }

        .toast-error {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .toast-error .toast-icon {
            background: #fef2f2;
            border: 2px solid #ef4444;
        }

        /* Ad Modal Countdown */
        #countdown {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f24b0b;
            transition: all 0.3s;
        }

        .page-loader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fffaf5 0%, #f8f9fa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #splashOwl {
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: opacity, transform;
        }

        @media (prefers-reduced-motion: reduce) {
            #splashOwl,
            .page-loader,
            .page-loader.hidden {
                transition: none !important;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>

        <lottie-player

    <nav class="navbar">

    <!-- Ad Reward Modal -->
    <div id="ad-modal" class="modal">

                <!-- Yandex Banner Ad Area -->
                <div id="yandex-banner" style="margin: 20px 0; min-height: 300px; background:#f8f9fa; border-radius:12px; display:flex; align-items:center; justify-content:center;">
                    <!-- Yandex.RTB R-A-19402847-4 -->
                    <div id="yandex_rtb_R-A-19402847-4"></div>
                    <script>
                    window.yaContextCb.push(() => {

                        })
                    })
                    </script>
                </div>

                <h2 style="color:#06a87c; margin-bottom:20px; font-weight: bolder;">Thank You for Supporting Us ❤️</h2>

                <div id="countdown" style="font-size: 2.2rem; font-weight: 800; color:#f24b0b; margin: 25px 0;">
                    5
                </div>

                <button id="close-ad-btn" class="close-ad-button" onclick="closeAdModal()" 
                        style="display:none; width:100%; padding:16px; background: #f24b0b;
            box-shadow: 0 4px 0 #c23a0a; color:white; border:none; border-radius:50px; font-weight:700;">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Toast -->
    <div id="customToast" class="custom-toast">
        <div class="toast-content">
            <img id="toastIcon" class="toast-icon" src="" alt="">
            <div id="toastMessage" class="toast-message"></div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-column">
                <h3>Summage Academy</h3>

                    <li><a href="/">Home</a></li>

            <div class="footer-column">

                    <li><a href="/authentication/">Start Learning</a></li>
                    <li><a href="/learn/blogs/">Blog</a></li>

        <div class="footer-bottom">

    </footer>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDX73k3QqXr9xu_PKkQBkr9pUNp7zmtrW0",
            authDomain: "summage-backend.firebaseapp.com",
            projectId: "summage-backend",
            storageBucket: "summage-backend.firebasestorage.app",
            messagingSenderId: "128191434358",
            appId: "1:128191434358:web:4c9e9f4f9ff4a23db5d957"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let selectedItem = null;
        let userPurchases = {};   // Will store active purchases

        const items = [
            {
                id: "essay_checking",
                title: "Unlimited Essay Checking",
                duration: "12 hours",
                price: 85000,
                currency: "coins",
                image: "/assets/images/blog-assets/essay-checker-purchase.webp",
                description: "Get unlimited essay feedback and corrections for 12 hours"
            },
            {
                id: "full_heartbar",
                title: "Full Heartbar (Games)",
                duration: "1 hour",
                price: 12000,
                currency: "diamonds",
                image: "/assets/images/blog-assets/game-hearts-purchase.webp",
                description: "Unlimited hearts for all games for 1 hour"
            },
            {
                id: "ai_practice",
                title: "Unlimited AI Practice",
                duration: "1 hour",
                price: 45000,
                currency: "coins",
                image: "/assets/images/blog-assets/speaking-purchase.webp",
                description: "Unlimited AI conversations and practice sessions for 1 hour"
            }
        ];

        function getCurrencyIcon(currency) {
            return currency === "coins" 
                ? `<span style="color:#f4a261;">🪙</span>` 
                : `<span style="color:#06a87c;">💎</span>`;
        }

        function renderMarketplace() {
            const grid = document.getElementById('marketplace-grid');
            grid.innerHTML = '';

            items.forEach(item => {
                const isOwned = userPurchases[item.id] && userPurchases[item.id] > Date.now();

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <img src="${item.image}" class="card-image" alt="${item.title}">
                    <div class="card-content">
                        <h3 class="item-title">${item.title}</h3>
                        ${isOwned
                            ? `<button class="buy-btn" style="background:#888; box-shadow:0 4px 0 #555; cursor:default;" disabled>You Have It</button>`
                            : item.id === "ai_practice"
                                ? `<button class="buy-btn" style="background:#b8b8b8; box-shadow:0 4px 0 #8c8c8c; cursor:not-allowed; opacity:0.9;" disabled>Coming Soon</button>`
                                : `<button class="buy-btn" onclick="openPurchaseModal('${item.id}')">Watch Ad</button>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadUserPurchases() {
            if (!currentUser) return;

            try {
                const snapshot = await db.collection('purchases')
                    .where('userId', '==', currentUser.uid)
                    .get();

                userPurchases = {};
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.expiresAt > Date.now()) {
                        userPurchases[data.itemId] = data.expiresAt;
                    }
                });

                renderMarketplace();   // Refresh the cards
            } catch (e) {
                console.error("Failed to load purchases:", e);
            }
        }

        function openPurchaseModal(id) {
            selectedItem = items.find(item => item.id === id);
            if (!selectedItem) return;

            document.getElementById('modal-image').src = selectedItem.image;
            document.getElementById('modal-title').textContent = selectedItem.title;
            document.getElementById('modal-description').textContent = selectedItem.description;
            

            document.getElementById('purchase-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('purchase-modal').classList.remove('show');
        }

        // Custom Toast Function
        function showToast(message, type = 'success', duration = 3200) {
            const toast = document.getElementById('customToast');
            const iconEl = document.getElementById('toastIcon');
            const messageEl = document.getElementById('toastMessage');

            toast.classList.remove('toast-success', 'toast-error', 'show');

            if (type === 'success') {
                iconEl.src = '/assets/images/menu-icons/check.png';
                toast.classList.add('toast-success');
            } else if (type === 'error') {
                iconEl.src = '/assets/images/menu-icons/close.png';
                toast.classList.add('toast-error');
            }

            messageEl.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        async function confirmPurchase() {
            if (!currentUser || !selectedItem) {
                showToast("Please log in to unlock this item.", "error");
                return;
            }

            closeModal(); // Close purchase modal

            // Show custom Ad Modal
            document.getElementById('ad-modal').classList.add('show');
            startCountdown();
        }

        // Updated reward function
        async function rewardUserAfterAd() {
            if (!currentUser || !selectedItem) return;

            try {
                const durationHours = selectedItem.duration.includes("12") ? 12 : 1;
                const expiresAt = Date.now() + durationHours * 60 * 60 * 1000;

                // Save the purchase
                await db.collection('purchases').add({
                    userId: currentUser.uid,
                    itemId: selectedItem.id,
                    title: selectedItem.title,
                    expiresAt: expiresAt,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    source: "ad_reward"
                });

                // === SPECIAL HANDLING FOR FULL HEARTBAR ===
                if (selectedItem.id === "full_heartbar") {
                    const userRef = db.collection("users").doc(currentUser.uid);
                    
                    await userRef.set({
                        hearts: 5,                    // Refill to maximum
                        lastHeartReset: getTodayDateString()  // Update reset date so it doesn't reset soon
                    }, { merge: true });

                    console.log("💎 Full Heartbar purchased → Hearts refilled to 5");
                }

                showToast(`${selectedItem.title} unlocked successfully!`, "success");
                
                // Refresh purchases (and cards)
                await loadUserPurchases();

            } catch (error) {
                console.error("Reward error:", error);
                showToast("Failed to unlock item. Please try again.", "error");
            }
        }

        // Helper function (add this if not already present)
        function getTodayDateString() {
            return new Date().toISOString().split('T')[0];
        }

        // Close modal when clicking overlay
        document.getElementById('purchase-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function goBack() {
            const before = window.location.href;
            
            history.back();
            
            setTimeout(() => {
                if (window.location.href === before) {
                    window.location.assign('/learn/');
                }
            }, 50);
        }

        let countdownInterval;

        function startCountdown() {
            let timeLeft = 5;
            const countdownEl = document.getElementById('countdown');
            const closeBtn = document.getElementById('close-ad-btn');

            closeBtn.style.display = 'none';

            // Load Yandex Banner Ad
            try {
                window.yaContextCb.push(() => {
                    Ya.Context.AdvManager.render({
                        "blockId": "R-A-19402847-3",   // Change if you have another block ID for banner
                        "type": "banner",
                        "platform": "touch"
                    });
                });
            } catch(e) {}

            countdownInterval = setInterval(() => {
                timeLeft--;
                countdownEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownEl.style.display = 'none';
                    closeBtn.style.display = 'block';
                }
            }, 1000);
        }

        function closeAdModal() {
            clearInterval(countdownInterval);
            document.getElementById('ad-modal').classList.remove('show');
            document.getElementById('countdown').style.display = 'block';
            
            // Give reward after user closes ad modal
            rewardUserAfterAd();
        }

        // Close ad modal when clicking overlay
        document.getElementById('ad-modal').addEventListener('click', function(e) {
            if (e.target === this) closeAdModal();
        });

        // Initialize
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                loadUserPurchases();
            } else {
                auth.signInAnonymously();
            }
        });

        document.getElementById('current-year').textContent = new Date().getFullYear();

        window.onload = renderMarketplace;

        
        // Splash screen logic
        const loader = document.getElementById('pageLoader');
        const owl = document.getElementById('splashOwl');

        const MIN_DURATION = 1500;
        let minTimePassed = false;

        setTimeout(() => {
            if (owl) {
                owl.style.opacity = '1';
                owl.style.transform = 'scale(1) translateY(0)';
            }
        }, 400);

        setTimeout(() => {
            minTimePassed = true;
            if (document.readyState === 'complete') hideLoader();
        }, MIN_DURATION);

        window.addEventListener('load', () => {
            if (minTimePassed) {
                hideLoader();
            } else {
                setTimeout(hideLoader, MIN_DURATION);
            }
        });

        function hideLoader() {
            if (loader.classList.contains('hidden')) return;
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 1400);
        }

        setTimeout(() => hideLoader(), 7000);
    </script>
</body>
</html>
